<div class="container">
  <h2>Frontend v2.0</h2>

  <section>
    <h3>Отправка данных</h3>
    <input #textBox type="text" placeholder="Введите текст" />
    <button (click)="sendData(textBox)">Отправить</button>
    <p>{{ message() }}</p>
  </section>

  <hr />

  <section>
    <h3>Получение данных</h3>
    <button (click)="getData()">Получить данные</button>
    <textarea readonly rows="6" [value]="receivedData()" placeholder="Здесь появится содержимое data.txt"></textarea>
  </section>
</div>
